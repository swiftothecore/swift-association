<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- A speakable address for the feedback form, and the single place its URL lives.
     If the form ever moves, this file changes and every "swiftassociation.com/feedback"
     already said out loud keeps working. No canonical tag here: the destination is
     off-site, so the honest instruction to a crawler is "don't index the hop". -->
<meta http-equiv="refresh" content="0;url=https://forms.gle/XhQHcLtvzrwLHuzQ8">
<meta name="robots" content="noindex">
<title>Redirecting to the feedback form...</title>
<script>window.location.replace('https://forms.gle/XhQHcLtvzrwLHuzQ8');</script>
</head>
<body>
<!-- Only ever seen if both the script and the refresh are blocked, or if the form is
     gone. A bare white page would look broken; a link is still a way through. -->
<p>Taking you to the feedback form. If nothing happens,
<a href="https://forms.gle/XhQHcLtvzrwLHuzQ8">open it here</a>.</p>
</body>
</html>
