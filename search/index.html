<body>
<div class="sx-desk" aria-hidden="true">
  <!-- LEFT: brass hand magnifier set down beside the page, handle running off
       the screen edge. The lens does the searcher's job on the desk itself:
       the wood grain under the glass is drawn back bigger and darker, with a
       refraction band at the rim and a diagonal glare. -->
  <div class="sx-desk-item dx-loupe">
    <svg viewBox="0 0 480 232" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="lpBrass" x1="0" y1="0" x2="0.85" y2="1"><stop offset="0" stop-color="#ecc87e"/><stop offset="0.5" stop-color="#cfa050"/><stop offset="1" stop-color="#a1742f"/></linearGradient>
        <linearGradient id="lpWood" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8a5a30"/><stop offset="0.45" stop-color="#633c1c"/><stop offset="1" stop-color="#41250e"/></linearGradient>
        <radialGradient id="lpGlass" cx="0.38" cy="0.32" r="0.85"><stop offset="0" stop-color="#eef4f0" stop-opacity="0.26"/><stop offset="0.6" stop-color="#dbe6df" stop-opacity="0.1"/><stop offset="1" stop-color="#9fb4a8" stop-opacity="0.26"/></radialGradient>
        <clipPath id="lpClip"><circle cx="356" cy="116" r="84"/></clipPath>
      </defs>
      <!-- turned wooden handle, pommel trailing off screen left -->
      <ellipse cx="34" cy="116" rx="17" ry="18" fill="url(#lpWood)"/>
      <path d="M36 101 C92 93 152 95 202 102 C228 106 246 108 257 109 L257 123 C246 124 228 126 202 130 C152 137 92 139 36 131 Z" fill="url(#lpWood)"/>
      <path d="M44 100.5 C100 93.5 160 95.5 236 105" fill="none" stroke="#a5714a" stroke-width="2.2" stroke-linecap="round" opacity="0.75"/>
      <path d="M60 133 C110 138 160 137 210 129" fill="none" stroke="#2c1706" stroke-width="1.6" stroke-linecap="round" opacity="0.5"/>
      <path d="M64 98.6 q4 17.4 0 34.8 M72 98 q4 18 0 36" fill="none" stroke="#341d0a" stroke-width="1.4" opacity="0.55"/>
      <!-- brass collar where the handle meets the ring -->
      <rect x="252" y="100" width="18" height="32" rx="3" fill="url(#lpBrass)" stroke="#7c5a22" stroke-width="1"/>
      <rect x="255" y="103" width="12" height="4" rx="2" fill="#f4d896" opacity="0.8"/>
      <!-- lens interior first: glass tint over magnified wood grain -->
      <g clip-path="url(#lpClip)">
<!-- counter-rotated against the item's CSS rotate(50deg) so the magnified
             grain lies parallel with the desk grain outside the glass -->
        <g fill="none" stroke="#6f4e20" stroke-linecap="round" transform="rotate(-55 356 116)">
          <path d="M268 56 q46 6 88 0 q46 -6 92 0" stroke-width="5" opacity="0.24"/>
          <path d="M268 82 q46 -7 88 0 q46 7 92 0" stroke-width="4" opacity="0.28"/>
          <path d="M268 108 q40 6 84 1 q48 -5 96 1" stroke-width="6" opacity="0.22"/>
          <path d="M268 136 q46 -6 88 -1 q46 5 92 -1" stroke-width="4.5" opacity="0.28"/>
          <path d="M268 162 q46 6 88 0 q46 -6 92 0" stroke-width="5" opacity="0.22"/>
          <ellipse cx="394" cy="148" rx="27" ry="8.5" stroke-width="2.4" opacity="0.26"/>
          <ellipse cx="394" cy="148" rx="14" ry="4.5" stroke-width="2" opacity="0.3"/>
        </g>
        <circle cx="356" cy="116" r="84" fill="url(#lpGlass)"/>
        <!-- refraction band just inside the rim, then the darker seat shadow -->
        <circle cx="356" cy="116" r="78" fill="none" stroke="#ffffff" stroke-width="4" opacity="0.1"/>
        <path d="M298 164 A75 75 0 0 0 430 130" fill="none" stroke="#2e2010" stroke-width="9" opacity="0.12"/>
        <!-- diagonal glare, kept faint so it reads as light on glass, not as
             an object under it -->
        <path d="M316 76 L384 144" stroke="#ffffff" stroke-opacity="0.12" stroke-width="8" stroke-linecap="round"/>
        <path d="M332 66 L390 124" stroke="#ffffff" stroke-opacity="0.24" stroke-width="2.6" stroke-linecap="round"/>
        <ellipse cx="320" cy="78" rx="9" ry="5.5" fill="#ffffff" opacity="0.12" transform="rotate(-38 320 78)"/>
      </g>
      <!-- the brass ring, milled edge, rim lines and a top sheen -->
      <circle cx="356" cy="116" r="92" fill="none" stroke="url(#lpBrass)" stroke-width="13"/>
      <circle cx="356" cy="116" r="92" fill="none" stroke="#7c5822" stroke-width="13" stroke-dasharray="1.7 7.3" opacity="0.16"/>
      <circle cx="356" cy="116" r="98.5" fill="none" stroke="#6e4d1c" stroke-width="1.3" opacity="0.9"/>
      <circle cx="356" cy="116" r="85.5" fill="none" stroke="#5f421a" stroke-width="1.2" opacity="0.9"/>
      <path d="M282 62 A92 92 0 0 1 430 62" fill="none" stroke="#f4d896" stroke-width="2.5" stroke-linecap="round" opacity="0.8"/>
    </svg>
  </div>
  <!-- LEFT: the gold highlighter, uncapped and set down mid-thought. This is
       the pen behind every highlight on the page, so it earns its spot on the
       desk, and it is the one prop here whose job is to be recognised at a
       glance rather than examined.

       14cm end to end, so 420px at the desk's 3px per mm, on a 16mm barrel.
       The old one was drawn at 7cm, which is a pen for a doll's house, and
       that plus a flat barrel is why it read as a sticker rather than an
       object. A cylinder needs four stops across its width, not two: lit edge,
       body, shade, and then the desk's bounce coming back up the far rim. That
       last one is the whole trick; without it a barrel is a flat with stripes.

       Uncapped and face down means the felt is touching the wood, so there is
       a small pool of gold under the chisel and a test swipe drying alongside.
       The swipe rotates with the prop, which just reads as a swipe drawn at
       that angle. -->
  <div class="sx-desk-item dx-marker">
    <svg viewBox="0 0 430 230" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <!-- the barrel, seen across its width -->
        <linearGradient id="hmBody" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#fbf7ea"/><stop offset="0.30" stop-color="#eee4c9"/>
          <stop offset="0.74" stop-color="#b6a67c"/><stop offset="1" stop-color="#d8cba6"/>
        </linearGradient>
        <!-- the cap sits lower and turns a little further from the lamp -->
        <linearGradient id="hmCap" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#f7f2e2"/><stop offset="0.30" stop-color="#e7dcbe"/>
          <stop offset="0.74" stop-color="#ab9b72"/><stop offset="1" stop-color="#cec19c"/>
        </linearGradient>
        <linearGradient id="hmGold" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#f4d982"/><stop offset="0.30" stop-color="#dcb03c"/>
          <stop offset="0.74" stop-color="#94701f"/><stop offset="1" stop-color="#c9a038"/>
        </linearGradient>
        <linearGradient id="hmFelt" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#f0c95a"/><stop offset="0.45" stop-color="#d5a12a"/>
          <stop offset="1" stop-color="#a97c18"/>
        </linearGradient>
        <!-- one lacquer specular running the LENGTH of the barrel, brightest
             three-fifths along and gone before either end -->
        <linearGradient id="hmSheen" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0" stop-color="#fffdf4" stop-opacity="0"/>
          <stop offset="0.2" stop-color="#fffdf4" stop-opacity="0.3"/>
          <stop offset="0.5" stop-color="#fffdf4" stop-opacity="0.46"/>
          <stop offset="0.82" stop-color="#fffdf4" stop-opacity="0.2"/>
          <stop offset="1" stop-color="#fffdf4" stop-opacity="0"/>
        </linearGradient>
        <!-- pen plastic is satin, not glass: a little surface noise under the
             specular stops it reading as vector fill -->
        <filter id="hmMatte" x="0" y="0" width="100%" height="100%">
          <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="3" seed="23"/>
          <feColorMatrix type="matrix" values="0 0 0 0 0.36  0 0 0 0 0.31  0 0 0 0 0.2  0 0 0 0.34 0"/>
        </filter>
        <!-- ink soaks into wood along the grain, so it spreads sideways rather
             than pooling round -->
        <filter id="hmSoak" x="-20%" y="-20%" width="140%" height="140%">
          <feTurbulence type="fractalNoise" baseFrequency="0.03 0.09" numOctaves="2" seed="12" result="n"/>
          <feDisplacementMap in="SourceGraphic" in2="n" scale="7" xChannelSelector="R" yChannelSelector="G"/>
        </filter>
        <clipPath id="hmBarrel"><rect x="118" y="30" width="230" height="48" rx="7"/></clipPath>
        <clipPath id="hmCapClip"><rect x="152" y="146" width="168" height="50" rx="9"/></clipPath>
      </defs>

      <!-- THE TEST SWIPE, laid before the pen so the pen sits on top of its own
           mark. Two passes at different widths because a chisel held at an
           angle does not lay one even band, a wet pool where the stroke
           stopped, and two darker fibres where the felt dragged. -->
      <g filter="url(#hmSoak)">
        <path d="M266 6 C204 8 130 14 62 21" fill="none" stroke="#e6b32f" stroke-width="19"
              stroke-opacity="0.32" stroke-linecap="round"/>
        <path d="M256 10 C200 12 134 17 70 23" fill="none" stroke="#d9a827" stroke-width="12"
              stroke-opacity="0.22" stroke-linecap="round"/>
        <path d="M254 -1 C198 1 132 6 70 13" fill="none" stroke="#b98d1e" stroke-width="1.3" stroke-opacity="0.26"/>
        <path d="M250 15 C198 17 136 22 76 29" fill="none" stroke="#b98d1e" stroke-width="1" stroke-opacity="0.22"/>
        <!-- the wet end, where the chisel stopped and the pen was put down -->
        <ellipse cx="57" cy="21" rx="10" ry="7.5" fill="#d9a827" opacity="0.3"/>
      </g>
      <!-- and the pool under the chisel itself, because an uncapped pen lying
           on its side is still writing -->
      <g filter="url(#hmSoak)">
        <ellipse cx="34" cy="63" rx="16" ry="8" fill="#d9a827" opacity="0.24"/>
        <ellipse cx="30" cy="62" rx="8" ry="4.5" fill="#c19420" opacity="0.28"/>
      </g>

      <!-- THE PEN. Tip at the left, butt at the right, barrel centred on y=54. -->
      <!-- chisel felt: the wedge is cut at an angle, so from above you see the
           broad face and the narrow one, and the leading edge is wet -->
      <path d="M20 45.5 L48 44 L48 65 L17 61.5 Z" fill="url(#hmFelt)"/>
      <!-- the cut face: this is the edge that lays the broad stroke, and it is
           darkest where it is still wet -->
      <path d="M20 45.5 L17 61.5" stroke="#a2751a" stroke-width="3.4" stroke-linecap="round"/>
      <path d="M23 48 L21 59" stroke="#8a5f12" stroke-width="1.4" opacity="0.5"/>
      <path d="M25 45 L50 43.8" stroke="#f6dc8e" stroke-width="1.7" stroke-linecap="round" opacity="0.5"/>
      <!-- the collar the felt sits in, tapering out to the cone -->
      <path d="M48 43 L60 36 L60 74 L48 66 Z" fill="url(#hmBody)" stroke="#a8956d" stroke-width="0.9"/>
      <path d="M52 45 L58 40" stroke="#fdfaf0" stroke-width="1.6" stroke-linecap="round" opacity="0.55"/>
      <!-- nose cone: 25mm of taper from the barrel down to the collar -->
      <path d="M132 28 C104 30 76 33 60 36 L60 74 C76 77 104 80 132 82 Z"
            fill="url(#hmBody)" stroke="#a8956d" stroke-width="1"/>
      <path d="M132 28 C104 30 76 33 60 36 L60 74 C76 77 104 80 132 82 Z"
            filter="url(#hmMatte)" opacity="0.3"/>
      <path d="M62 40 C82 38 108 34 128 33" fill="none" stroke="#fdfaf0" stroke-width="2.6"
            stroke-linecap="round" opacity="0.6"/>
      <path d="M66 71 C86 73 110 76 128 77" fill="none" stroke="#a8956d" stroke-width="2"
            stroke-linecap="round" opacity="0.38"/>
      <!-- moulded grip rings round the cone -->
      <g fill="none" stroke="#b3a175" stroke-width="1.1" opacity="0.5">
        <path d="M78 33.6 C74 45 74 65 78 76.8"/>
        <path d="M92 31.8 C88 44 88 66 92 78.6"/>
      </g>
      <!-- the gold ferrule ring where the cone meets the barrel -->
      <rect x="118" y="28" width="15" height="54" rx="3" fill="url(#hmGold)" stroke="#8b6a1d" stroke-width="0.9"/>
      <rect x="120" y="34" width="11" height="5" rx="2.5" fill="#f7e3a4" opacity="0.7"/>
      <!-- the barrel -->
      <rect x="130" y="30" width="218" height="48" rx="7" fill="url(#hmBody)" stroke="#b7a67f" stroke-width="1"/>
      <g clip-path="url(#hmBarrel)">
        <rect x="118" y="30" width="230" height="48" filter="url(#hmMatte)" opacity="0.3"/>
        <rect x="130" y="33" width="218" height="9" rx="4" fill="url(#hmSheen)"/>
        <!-- the printed label: two rules and the shade name between them -->
        <path d="M146 46 H332" stroke="#b3a175" stroke-width="1.1" opacity="0.6"/>
        <path d="M146 68 H332" stroke="#b3a175" stroke-width="1.1" opacity="0.6"/>
        <path d="M146 71.5 H332" stroke="#a8956d" stroke-width="2.4" opacity="0.35"/>
      </g>
      <text class="dx-label" x="239" y="61">gold</text>
      <!-- posted end cap -->
      <rect x="344" y="32" width="26" height="44" rx="10" fill="url(#hmGold)" stroke="#8b6a1d" stroke-width="1"/>
      <path d="M350 37 q9 -2.4 14 1.2" fill="none" stroke="#f7e3a4" stroke-width="2.2"
            stroke-linecap="round" opacity="0.75"/>

      <!-- THE CAP, tossed down alongside and still roughly parallel. Its open
           end faces back toward the pen, and what says "open" is the bore: a
           dark ellipse with the wall thickness showing as a bright rim. -->
      <g transform="rotate(-5 236 171)">
        <rect x="152" y="146" width="168" height="50" rx="9" fill="url(#hmCap)" stroke="#b7a67f" stroke-width="1"/>
        <g clip-path="url(#hmCapClip)">
          <rect x="152" y="146" width="168" height="50" filter="url(#hmMatte)" opacity="0.3"/>
          <rect x="152" y="149" width="168" height="9" rx="4" fill="url(#hmSheen)"/>
          <path d="M168 187 H310" stroke="#a8956d" stroke-width="2.2" opacity="0.35"/>
        </g>
        <rect x="300" y="146" width="20" height="50" rx="9" fill="url(#hmGold)" stroke="#8b6a1d" stroke-width="0.9"/>
        <path d="M305 151 q7 -2 11 1" fill="none" stroke="#f7e3a4" stroke-width="1.9"
              stroke-linecap="round" opacity="0.7"/>
        <!-- the bore -->
        <ellipse cx="152" cy="171" rx="6" ry="25" fill="#413a2c"/>
        <ellipse cx="153.5" cy="171" rx="3.6" ry="20" fill="#241f16"/>
        <path d="M148.5 156 A6 25 0 0 0 148.5 186" fill="none" stroke="#f4efdd" stroke-width="1.8" opacity="0.55"/>
      </g>
    </svg>
  </div>
  <!-- LEFT: a stack of ruled index cards half under the screen edge, clipped
       together. The top card carries a search that already happened on paper:
       word-notes down the ruled lines, one swiped with the gold highlighter,
       one circled in red pen.

       5x3 inches, so 381x229 at the desk's 3px/mm, with 8mm ruling. The old
       pile was four flat rects at 10x6cm; what makes a stack is not the fourth
       rect, it is that each card casts a shadow on the one under it and that
       no two edges are parallel.

       The writing is generated (scripts/art/make_searcher_props.py). Scrawl
       drawn as one amplitude at one spacing is a zigzag, not handwriting: the
       x-height has to wander, about one letter in six has to break the band
       with an ascender or a descender, the baseline has to drift, and the
       WORDS have to vary in length or the line reads as a dashed rule. -->
  <div class="sx-desk-item dx-cards">
    <svg viewBox="0 0 440 320" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="icSteel" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0" stop-color="#f4f1e8"/><stop offset="0.32" stop-color="#c6c0b0"/>
          <stop offset="0.74" stop-color="#7e7768" stop-opacity="1"/><stop offset="1" stop-color="#aaa393"/>
        </linearGradient>
        <!-- card stock is fibrous, and the fibre is most of what separates
             paper from a filled rectangle at this size -->
        <filter id="icFibre" x="0" y="0" width="100%" height="100%">
          <feTurbulence type="fractalNoise" baseFrequency="0.5 0.85" numOctaves="3" seed="17"/>
          <feColorMatrix type="matrix" values="0 0 0 0 0.42  0 0 0 0 0.35  0 0 0 0 0.22  0 0 0 0.42 0"/>
        </filter>
        <!-- a guillotined edge is straight but not ruler-straight; a small
             displacement is worth more here than any amount of geometry -->
        <filter id="icEdge" x="-8%" y="-8%" width="116%" height="116%">
          <feTurbulence type="fractalNoise" baseFrequency="0.021 0.03" numOctaves="2" seed="6" result="n"/>
          <feDisplacementMap in="SourceGraphic" in2="n" scale="2.4" xChannelSelector="R" yChannelSelector="G"/>
        </filter>
        <filter id="icDrop" x="-14%" y="-14%" width="132%" height="132%">
          <feDropShadow dx="2.2" dy="3.4" stdDeviation="2.6" flood-color="#4a3a1c" flood-opacity="0.3"/>
        </filter>
        <clipPath id="icTop"><rect x="-190.5" y="-114.5" width="381" height="229" rx="5"/></clipPath>
      </defs>
      <g transform="translate(220 160)">
        <!-- THE PILE. Each card carries its own drop shadow, which is the only
             reason four rectangles read as four cards: what you actually see in
             a stack is the shadow of each edge on the sheet below it. -->
        <g filter="url(#icEdge)">
          <g filter="url(#icDrop)">
            <rect x="-190.5" y="-114.5" width="381" height="229" rx="5" transform="rotate(6.5)"
                  fill="#ece3c8" stroke="#c5b592" stroke-width="1"/>
          </g>
          <g filter="url(#icDrop)">
            <rect x="-190.5" y="-114.5" width="381" height="229" rx="5" transform="rotate(-4.5)"
                  fill="#f1e9d0" stroke="#c5b592" stroke-width="1"/>
          </g>
          <g filter="url(#icDrop)">
            <rect x="-190.5" y="-114.5" width="381" height="229" rx="5" transform="rotate(2)"
                  fill="#eee6cb" stroke="#c5b592" stroke-width="1"/>
          </g>
        </g>

        <!-- the inner loop of the paperclip passes BEHIND the top card, so it
             is drawn before it and only the stretch above the card edge shows -->
        <g transform="translate(-58 -116) rotate(-7)" fill="none" stroke-linecap="round">
          <g id="icClipBack"><path d="M27 -12 C27 -25 11 -25 11 -12 L11 34"/></g>
          <use href="#icClipBack" stroke="#78715f" stroke-width="3.6" transform="translate(0.8 1)"/>
          <use href="#icClipBack" stroke="url(#icSteel)" stroke-width="2.9"/>
        </g>

        <!-- THE TOP CARD -->
        <g transform="rotate(-1.5)">
          <g filter="url(#icEdge)">
            <g filter="url(#icDrop)">
              <rect x="-190.5" y="-114.5" width="381" height="229" rx="5"
                    fill="#f8f2de" stroke="#c9ba97" stroke-width="1.1"/>
            </g>
          </g>
          <g clip-path="url(#icTop)">
            <rect x="-190.5" y="-114.5" width="381" height="229" filter="url(#icFibre)" opacity="0.5"/>
            <!-- the ruling: one red header rule, then 8mm blue. Printed rules
                 sit IN the paper, so they take its fibre rather than lying on
                 top of it, which is why they are inside the clip. -->
            <path d="M-190.5 -84 H190.5" stroke="#b23a3f" stroke-width="1.5" opacity="0.45"/>
            <g stroke="#8f9ab8" stroke-width="1.1" opacity="0.3">
              <path d="M-190.5 -60 H190.5"/><path d="M-190.5 -36 H190.5"/><path d="M-190.5 -12 H190.5"/>
              <path d="M-190.5 12 H190.5"/><path d="M-190.5 36 H190.5"/><path d="M-190.5 60 H190.5"/>
              <path d="M-190.5 84 H190.5"/>
            </g>
            <!-- the gold swipe goes down BEFORE the ink, the way a highlighter
                 over dry pen would not: this word was marked as it was written.
                 Two passes, a wet pool where the pen stopped, and two darker
                 fibres where the chisel dragged. -->
            <g transform="rotate(-0.8)">
              <path d="M-106 -43 C-80 -45 -48 -45.5 -28 -44" fill="none" stroke="#e6b32f"
                    stroke-width="19" stroke-opacity="0.34" stroke-linecap="round"/>
              <path d="M-102 -40 C-78 -42 -50 -42.5 -32 -41" fill="none" stroke="#d9a827"
                    stroke-width="12" stroke-opacity="0.24" stroke-linecap="round"/>
              <ellipse cx="-27" cy="-43.5" rx="6" ry="8.5" fill="#d9a827" opacity="0.3"/>
              <path d="M-100 -49 C-76 -51 -48 -51.5 -32 -50.5" fill="none" stroke="#b98d1e"
                    stroke-width="1.1" stroke-opacity="0.26"/>
              <path d="M-98 -37 C-76 -39 -52 -39 -36 -38" fill="none" stroke="#b98d1e"
                    stroke-width="0.9" stroke-opacity="0.22"/>

        <button type="button" data-mode="exact" title="Match the exact word only">
          <span class="sx-seg-name">exact word</span><span class="sx-seg-eg">love only</span></button>
        <button type="button" data-mode="fuzzy" title="Tolerate typos and near-spellings">
          <span class="sx-seg-name">allow typos</span><span class="sx-seg-eg">lvoe &rarr; love</span></button>
        <button type="button" data-mode="contains" title="Find these letters anywhere inside a word (a wordplay tool, not a game word match)">
          <span class="sx-seg-name">letters in a word</span><span class="sx-seg-eg">test &rarr; protested</span></button>
      </div>
    </div>
    <div class="sx-ctrl-group">
      <span class="sx-ctrl-label">how to list</span>
      <div class="sx-seg" role="group" aria-label="Result layout">
        <button type="button" data-view="grouped" title="Group matching lines by album">by album</button>
        <button type="button" data-view="flat" title="One flat list of every matching line">one list</button>
      </div>
    </div>
    <div class="sx-ctrl-group">
      <span class="sx-ctrl-label">narrow it down</span>
      <div class="sx-filters">
        <label class="sx-filter"><select id="section" aria-label="Filter by section type"></select></label>
        <label class="sx-filter"><select id="pos" aria-label="Filter by where the word sits in the line">
          <option value="any">anywhere in the line</option>
          <option value="start">starts the line</option>
          <option value="end">ends the line</option>
        </select></label>
      </div>
    </div>
  </div>
  <p id="explain" class="sx-explain" aria-live="polite"></p>

  <div id="counter" class="sx-counter" aria-live="polite"></div>
  <div id="bar" class="sx-bar"></div>
  <div id="barlabel" class="sx-barlabel" aria-live="polite"></div>
  <div id="concord" class="sx-concord" aria-live="polite"></div>
  <div id="results" class="sx-results"></div>
</main>

<nav id="rail" class="sx-rail" aria-label="Jump to an album"></nav>

<script type="module" src="search.js"></script>
<script>
  // Register the shared root service worker (scope "/") so the searcher works
  // offline even when opened directly, not only after visiting the game first.
  if ("serviceWorker" in navigator) {
    addEventListener("load", () => navigator.serviceWorker.register("../sw.js").catch(() => {}));
  }
</script>
</body>
</html>
