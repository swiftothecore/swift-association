<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1733" viewBox="0 0 1600 1733">
  <!-- Seamless blonde-oak colour and fine fibres. The 1733px period is independent of the 4800px growth figure; keep both at the same CSS width. -->
  <defs>
    <filter id="m" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.0016 0.0045" numOctaves="2" seed="8" stitchTiles="stitch" />
      <feColorMatrix type="matrix" values="0 0 0 0 0.42 0 0 0 0 0.32 0 0 0 0 0.18 1.1 0 0 0 -0.3" />
    </filter>
    <filter id="g" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.0035 0.19" numOctaves="4" seed="3" stitchTiles="stitch" />
      <feColorMatrix type="matrix" values="0 0 0 0 0.38 0 0 0 0 0.28 0 0 0 0 0.15 0 0 0 0.75 0" />
    </filter>
    <filter id="h" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.0028 0.14" numOctaves="3" seed="19" stitchTiles="stitch" />
      <feColorMatrix type="matrix" values="0 0 0 0 0.98 0 0 0 0 0.93 0 0 0 0 0.8 0 0 0 0.55 0" />
    </filter>
    <filter id="f" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.035 0.68" numOctaves="2" seed="37" stitchTiles="stitch" />
      <feColorMatrix type="matrix" values="0 0 0 0 0.36 0 0 0 0 0.25 0 0 0 0 0.12 1.8 0 0 0 -0.68" />
    </filter>
  </defs>
  <rect width="1600" height="1733" fill="#d2b98e" />
  <rect width="1600" height="1733" filter="url(#m)" opacity="0.6" />
  <rect width="1600" height="1733" filter="url(#g)" opacity="0.65" />
  <rect width="1600" height="1733" filter="url(#h)" opacity="0.5" />
  <rect width="1600" height="1733" filter="url(#f)" opacity="0.16" />
</svg>
